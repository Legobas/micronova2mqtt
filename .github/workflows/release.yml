name: Release

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test & Push to Docker
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: next_version
        uses: zwaldowski/semver-release-action@v6
        with:
          dry_run: false
          prefix: v
          bump: minor
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
            echo "version: ${{ steps.next_version.outputs.version }}"
            echo "version tag: ${{ steps.next_version.outputs.version_tag }}"
 
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.20'
  
      - name: Build
        run: go build -ldflags "-X main.Version=${{ steps.next_version.outputs.version }}"
  
      - name: Test
        run: go test -v ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push images to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ steps.next_version.outputs.version }}
          push: true
          platforms: linux/amd64, linux/arm64/v8, linux/arm/v7
          tags: legobas/micronova2mqtt:latest,legobas/micronova2mqtt:${{ steps.next_version.outputs.version }}
